services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind_db
    environment: 
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U {$$POSTGRES_USER} -d {$$POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
  
  cache:
    image: redis:7-alpine
    container_name: documind_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      retries: 5
    
  web:
    build: .
    container_name: documind_web
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: redis://cache:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
  
  worker:
    build: .
    container_name: documind_worker
    command: uv run celery -A app.core.celery:celery_app worker --loglevel=info
    volumes:
      - .:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+psycopg://documind:documind@db:5432/documind
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
volumes:
  postgres_data: {}